<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qualidade Fundição — Roca Brasil Caucaia</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
:root{--p:#1e293b;--pl:#334155;--ok:#0f766e;--bad:#b91c1c;--warn:#b45309;--acc:#c2410c;--bg:#f1f5f9;--c:#fff;--b:#e2e8f0;--t:#0f172a;--m:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--t)}
.header{background:linear-gradient(145deg,#0c1222 0%,#152238 40%,#1a2f4a 100%);color:#fff;padding:1.5rem 1.5rem 1.25rem;box-shadow:0 6px 24px rgba(0,0,0,.25);position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:0;right:0;width:45%;height:100%;background:radial-gradient(ellipse at 80% 20%,rgba(56,189,248,.12),transparent 60%);pointer-events:none}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#0f766e 0%,#38bdf8 50%,#0f766e 100%)}
.header-brand{display:flex;align-items:center;gap:.85rem;position:relative;z-index:1}
.header-logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#0f766e,#0e7490);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;letter-spacing:-.02em;box-shadow:0 2px 8px rgba(15,118,110,.4)}
.header h1{font-size:1.35rem;font-weight:700;letter-spacing:.01em;line-height:1.2}
.header .subtitle{font-size:.82rem;opacity:.88;margin-top:.2rem;font-weight:400;letter-spacing:.01em}
.header .company{font-size:.72rem;opacity:.7;margin-top:.15rem;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.header-meta{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.9rem;position:relative;z-index:1}
.header-chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:.28rem .7rem;border-radius:6px;font-size:.72rem;font-weight:600;backdrop-filter:blur(4px)}
.header-chip strong{color:#5eead4;font-weight:700}
.container{max-width:1280px;margin:0 auto;padding:1.1rem}
.selector{background:var(--c);border-radius:10px;padding:.9rem 1.1rem;box-shadow:0 1px 3px rgba(15,23,42,.06);margin-bottom:1.1rem;display:flex;flex-wrap:wrap;align-items:center;gap:.8rem}
.selector label{font-weight:600;color:var(--p)}
.selector select{font-size:1rem;padding:.5rem .9rem;border:2px solid #475569;border-radius:8px;min-width:250px;background:#f8fafc;font-weight:600}
.badge{background:#e2e8f0;color:var(--p);padding:.35rem .85rem;border-radius:999px;font-weight:700}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:.65rem;margin-bottom:1.1rem}
.kpi{background:var(--c);border-radius:10px;padding:.7rem .55rem;box-shadow:0 1px 3px rgba(15,23,42,.06);border-left:4px solid #475569;text-align:center}
.kpi .l{font-size:.62rem;font-weight:600;color:var(--m);text-transform:uppercase}
.kpi .v{font-size:1.25rem;font-weight:700;color:#0f172a;margin-top:.12rem}
.kpi.ok{border-left-color:var(--ok)}.kpi.bad{border-left-color:var(--bad)}.kpi.warn{border-left-color:var(--warn)}.kpi.acc{border-left-color:var(--acc)}
.def-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:1.1rem}
@media(max-width:700px){.def-row{grid-template-columns:1fr}}
.def-card{background:var(--c);border-radius:10px;padding:.9rem 1rem;box-shadow:0 1px 3px rgba(15,23,42,.06);text-align:center;border-top:4px solid}
.def-card.v{border-top-color:#c2410c}.def-card.s{border-top-color:#b45309}.def-card.q{border-top-color:#b91c1c}
.def-card .ph{font-size:.7rem;font-weight:600;color:var(--m);text-transform:uppercase}
.def-card .cd{font-size:1.6rem;font-weight:800;margin:.25rem 0 .1rem}
.def-card.v .cd{color:#c2410c}.def-card.s .cd{color:#b45309}.def-card.q .cd{color:#b91c1c}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.1rem}
@media(max-width:850px){.cg{grid-template-columns:1fr}}
.cc{background:var(--c);border-radius:10px;box-shadow:0 1px 3px rgba(15,23,42,.06);padding:.9rem}
.cc.full{grid-column:1/-1}
.cc h3{font-size:.88rem;color:var(--p);margin-bottom:.55rem;font-weight:600}
.cw,.cws{width:100%;position:relative}
.cw{height:220px}
.cws{height:160px}
.chart-scroll{width:100%!important;min-width:100%!important;height:100%;position:relative}
.sec{background:var(--c);border-radius:10px;box-shadow:0 1px 3px rgba(15,23,42,.06);margin-bottom:1.1rem;overflow:hidden}
.sh{color:#fff;padding:.6rem 1rem;font-weight:600;font-size:.88rem}
.pc{display:grid;grid-template-columns:1.45fr 1fr}
@media(max-width:850px){.pc{grid-template-columns:1fr}}
.pt{padding:.45rem;overflow-x:auto;-webkit-overflow-scrolling:touch}
.pt table{min-width:520px}
.pch{padding:.7rem;border-left:1px solid var(--b);background:#f8fafc;overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:850px){.pch{border-left:none;border-top:1px solid var(--b)}}
.ct{font-size:.78rem;font-weight:600;color:var(--p);margin-bottom:.35rem}
.cws{position:relative;height:170px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.75rem}
th,td{padding:.35rem .3rem;text-align:center;border-bottom:1px solid var(--b);white-space:nowrap;background:var(--c)}
th{background:#f1f5f9;font-weight:600;color:var(--p)}
td:first-child,th:first-child{
  text-align:left;padding-left:.65rem;font-weight:600;
  position:sticky;left:0;z-index:2;
  min-width:72px;max-width:100px;
  box-shadow:2px 0 4px rgba(15,23,42,.08)
}
th:first-child{background:#f1f5f9;z-index:3}
td:first-child{background:#fff}
tr.rt td:first-child{background:#f1f5f9}
th:last-child,td:last-child{background:#ecfdf5;font-weight:700}
tr.rt td{background:#f1f5f9}
tr.rt td:last-child{background:#d1fae5}
.z{color:#a0aec0}.rt{background:#f1f5f9;font-weight:700}
.footer{text-align:center;padding:1.1rem;font-size:.78rem;color:var(--m)}
.note{font-size:.72rem;color:var(--m);margin-top:.4rem}
.meta-ok{background:#d1fae5!important;color:#065f46;font-weight:700}
.meta-bad{background:#fee2e2!important;color:#991b1b;font-weight:700}

@media(max-width:600px){
  .kpi-grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:.45rem}
  .kpi .v{font-size:1.05rem}
  .cw{height:190px}
  .cws{height:140px}
  .chart-scroll{width:100%!important;min-width:0!important}
  .pt table{min-width:560px;font-size:.7rem}
  .header h1{font-size:1.15rem}
  .selector select{min-width:0;width:100%;max-width:100%}
  .selector{flex-direction:column;align-items:stretch}
}

.header-banner{width:100%;background:#0c1222;line-height:0;overflow:hidden}
.banner-img{width:100%;height:auto;display:block}
@media(max-width:700px){.banner-img{width:100%;height:auto}}
</style>
</head>

  const kpis=[['Fundido',fmt(p.fundido_total),'ok'],['QB.VRD',fmt(p.qb_vrd),'bad'],['FUN.BOM',fmt(funBom),'ok'],['QB.SECA',fmt(p.qb_seca),'warn'],['QB.CRUA',fmt(qbCru),'warn'],['TU.CRU',fmt(tuCru),'acc'],['%CRU',pct(tuCru,p.fundido_total),'acc'],['QB.QQ',fmt(p.qb_qq),'bad'],['TU.QMA',fmt(tuQma),'acc'],['%QB.QMA',pct(p.qb_qq,funBom),'bad'],['%QMA',pct(tuQma,funBom),'ok'],['TU',fmt(tu),'ok'],['%TU',pct(tu,funBom),'ok']];
  document.getElementById('kpis').innerHTML=kpis.map(([l,v,c])=>'<div class="kpi '+c+'"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>').join('');
  const tv=topDef(p.defeitos_verde),ts=topDef(p.defeitos_seca),tq=topDef(p.defeitos_queimada);
  document.getElementById('defCards').innerHTML='<div class="def-card v"><div class="ph">Quebra Verde — Principal Defeito</div><div class="cd">'+tv.code+'</div><div class="qt"><strong>'+fmt(tv.total)+'</strong> peças no período</div></div><div class="def-card s"><div class="ph">Quebra Seca — Principal Defeito</div><div class="cd">'+ts.code+'</div><div class="qt"><strong>'+fmt(ts.total)+'</strong> peças no período</div></div><div class="def-card q"><div class="ph">Quebra Queimada — Principal Defeito</div><div class="cd">'+tq.code+'</div><div class="qt"><strong>'+fmt(tq.total)+'</strong> peças no período</div></div>';
  kill('cFund');charts.cFund=new Chart(document.getElementById('cFund'),{type:'bar',data:{labels,datasets:[{label:'Fundido',data:p.fundido,backgroundColor:'#0f766e',borderRadius:4},{label:'Meta ('+MF+')',data:mF,type:'line',borderColor:'#b91c1c',borderWidth:2.5,pointRadius:3,fill:false,datalabels:{display:false}}]},options:common});
  kill('cQuebras');charts.cQuebras=new Chart(document.getElementById('cQuebras'),{type:'bar',data:{labels,datasets:[{label:'Verde',data:p.quebra_verde,backgroundColor:'#c2410c',borderRadius:3},{label:'Seca',data:p.quebra_seca,backgroundColor:'#b45309',borderRadius:3},{label:'Queimada',data:p.quebra_queimada,backgroundColor:'#b91c1c',borderRadius:3}]},options:common});
  barMeta('cQV',p.quebra_verde,mQV,'#c2410c','Meta ('+MQV+')');
  barMeta('cQS',p.quebra_seca,mQS,'#b45309','Meta ('+MQS+')');
  barMeta('cQQ',p.quebra_queimada,mQQ,'#b91c1c','Meta ('+MQQ+')');
  phaseSec('secVerde','Quebra Verde — Defeito × Dia × Quantidade','#c2410c',p.defeitos_verde,p.quebra_verde,'cDefV',MQV);
  phaseSec('secSeca','Quebra Seca — Defeito × Dia × Quantidade','#b45309',p.defeitos_seca,p.quebra_seca,'cDefS',MQS);
  phaseSec('secQueim','Quebra Queimada — Defeito × Dia × Quantidade','#b91c1c',p.defeitos_queimada,p.quebra_queimada,'cDefQ',MQQ);
}
document.getElementById('pessoa').addEventListener('change',e=>render(e.target.value));
render(document.getElementById('pessoa').value);
let _rt;
window.addEventListener('resize',()=>{
  clearTimeout(_rt);
  _rt=setTimeout(()=>render(document.getElementById('pessoa').value),200);
});
</script>
